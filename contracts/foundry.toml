[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = false
fs_permissions = [
    {access = "read-write", path = "./"},
    {access = "read-write", path = "../deployments"},
]

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bot_mainnet = "${BOT_RPC_URL}"

[etherscan]
bot_mainnet = {key = "${SCAN_API_KEY}", url = "https://scan.botchain.ai/api", chain = 677}
